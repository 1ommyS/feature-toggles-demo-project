spring:
  application:
    name: offer-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/offers}
    username: ${DB_USER:offers}
    password: ${DB_PASSWORD:offers}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 2000
      validation-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

feature-flags:
  provider: ${FEATURE_FLAGS_PROVIDER:local}
  local:
    offers:
      smart-ranking-v2: ${FEATURE_SMART_RANKING_V2:false}
  unleash:
    url: ${UNLEASH_URL:http://localhost:4242/api}
    token: ${UNLEASH_TOKEN:default:development.unleash-insecure-api-token}
    app-name: ${UNLEASH_APP_NAME:offer-service}
    instance-id: ${HOSTNAME:local}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{requestId:-}] %logger{36} - %msg%n"
