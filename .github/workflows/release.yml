name: Build, Publish and Deploy

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_repository: ${{ steps.vars.outputs.image_repository }}
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image variables
        id: vars
        shell: bash
        run: |
          echo "image_repository=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image_repository }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.image_tag }}
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  deploy-staging:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_STAGING_DEPLOY == 'true'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Deploy staging
        run: |
          helm upgrade --install offer-service deploy/helm/offer-service \
            --namespace offer-service-staging \
            --create-namespace \
            --set image.repository="${{ needs.image.outputs.image_repository }}" \
            --set image.tag="${{ needs.image.outputs.image_tag }}" \
            --set config.unleashUrl="${{ vars.UNLEASH_URL }}" \
            --wait \
            --timeout 5m

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Deploy production
        run: |
          helm upgrade --install offer-service deploy/helm/offer-service \
            --namespace offer-service \
            --create-namespace \
            --set image.repository="${{ needs.image.outputs.image_repository }}" \
            --set image.tag="${{ needs.image.outputs.image_tag }}" \
            --set config.unleashUrl="${{ vars.UNLEASH_URL }}" \
            --wait \
            --timeout 5m
