services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: offers
      POSTGRES_USER: offers
      POSTGRES_PASSWORD: offers
    ports:
      - "5432:5432"
    volumes:
      - offers-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offers -d offers"]
      interval: 5s
      timeout: 3s
      retries: 20

  unleash-db:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: unleash
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: unleash
    volumes:
      - unleash-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash -d unleash"]
      interval: 5s
      timeout: 3s
      retries: 20

  unleash:
    image: unleashorg/unleash-server:8.0.3
    depends_on:
      unleash-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://unleash:unleash@unleash-db:5432/unleash
      DATABASE_SSL: "false"
      UNLEASH_DEFAULT_ADMIN_USERNAME: admin
      UNLEASH_DEFAULT_ADMIN_PASSWORD: unleash4all
      INIT_BACKEND_API_TOKENS: default:development.unleash-insecure-api-token
      LOG_LEVEL: warn
    ports:
      - "4242:4242"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4242/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/offers
      DB_USER: offers
      DB_PASSWORD: offers
      FEATURE_FLAGS_PROVIDER: ${FEATURE_FLAGS_PROVIDER:-local}
      FEATURE_SMART_RANKING_V2: ${FEATURE_SMART_RANKING_V2:-false}
      UNLEASH_URL: http://unleash:4242/api
      UNLEASH_TOKEN: default:development.unleash-insecure-api-token
    ports:
      - "8080:8080"

volumes:
  offers-postgres-data:
  unleash-postgres-data:
